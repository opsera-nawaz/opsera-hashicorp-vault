name: Run linters

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:
    inputs:
      fips_gate_blocking:
        type: choice
        description: >-
          Switch the fips-regression-gate job from advisory (findings are
          reported but never block) to blocking (findings fail the job).
          See the fips-regression-gate job below for the phased rollout plan.
        options:
          - "false"
          - "true"
        default: "false"

concurrency:
  group: ${{ github.head_ref || github.run_id }}-lint
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ${{ github.repository == 'hashicorp/vault' && 'ubuntu-latest' || fromJSON('["self-hosted","ubuntu-22.04-x64"]') }}
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed-files }}
      is-ent-branch: ${{ steps.metadata.outputs.is-ent-branch }}
      workflow-trigger: ${{ steps.metadata.outputs.workflow-trigger }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/metadata
        id: metadata
      - if: steps.metadata.outputs.is-ent-repo == 'true'
        id: vault-auth
        name: Vault Authenticate
        run: vault-auth
      - if: steps.metadata.outputs.is-ent-repo == 'true'
        id: vault-secrets
        name: Fetch Vault Secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          secrets: |
            kv/data/github/${{ github.repository }}/github-token token | ELEVATED_GITHUB_TOKEN;
      - name: Ensure Go modules are cached
        uses: ./.github/actions/set-up-go
        with:
          github-token: ${{ steps.metadata.outputs.is-ent-repo != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
          no-restore: true # don't download them on a cache hit
      - uses: ./.github/actions/install-tools
        name: Ensure Vault tools are cached
        with:
          no-restore: true # don't download them on a cache hit
      - uses: ./.github/actions/changed-files
        id: changed-files
        with:
          github-token: ${{ steps.metadata.outputs.is-ent-repo != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}

  deprecations:
    name: Deprecated functions
    runs-on: ${{ github.repository == 'hashicorp/vault' && 'ubuntu-latest' || fromJSON('["self-hosted","ubuntu-22.04-x64"]') }}
    needs: setup
    permissions:
      contents: read
      id-token: write
    if: |
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_app') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_tests') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'quality_code')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: needs.setup.outputs.is-ent-branch == 'true'
        id: vault-auth
        name: Vault Authenticate
        run: vault-auth
      - if: needs.setup.outputs.is-ent-branch == 'true'
        id: vault-secrets
        name: Fetch Vault Secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          secrets: |
            kv/data/github/${{ github.repository }}/github-token token | ELEVATED_GITHUB_TOKEN;
      - uses: ./.github/actions/set-up-go
        with:
          github-token: ${{ needs.setup.outputs.is-ent-branch != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
          no-save: true
      - uses: ./.github/actions/install-tools # for staticcheck
      - run: make ci-deprecations
        name: Check deprecations

  codechecker:
    name: Code checks
    runs-on: ${{ github.repository == 'hashicorp/vault' && 'ubuntu-latest' || fromJSON('["self-hosted","ubuntu-22.04-x64"]') }}
    needs: setup
    permissions:
      contents: read
      id-token: write
    if: |
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_app') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_tests') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'proto') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'quality_code')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: needs.setup.outputs.is-ent-branch == 'true'
        id: vault-auth
        name: Vault Authenticate
        run: vault-auth
      - if: needs.setup.outputs.is-ent-branch == 'true'
        id: vault-secrets
        name: Fetch Vault Secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          secrets: |
            kv/data/github/${{ github.repository }}/github-token token | ELEVATED_GITHUB_TOKEN;
      - uses: ./.github/actions/set-up-go
        with:
          github-token: ${{ needs.setup.outputs.is-ent-branch != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
          no-save: true
      - uses: ./.github/actions/install-tools # for buf
        # Note: if there is a function we want to ignore the nilnil check for,
        # You can add 'ignore-nil-nil-function-check' somewhere in the
        # godoc for the function.
      - run: make ci-vet-codechecker
        name: Check custom linters (non-blocking)
        continue-on-error: true
      - run: make protolint
        name: Protobuf lint

  generate-delta:
    name: Protobuf generate delta
    runs-on: ${{ github.repository == 'hashicorp/vault' && 'ubuntu-latest' || fromJSON('["self-hosted","ubuntu-22.04-x64"]') }}
    needs: setup
    permissions:
      contents: read
      id-token: write
    if: |
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_app') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_tests') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'proto')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.setup.outputs.is-ent-branch == 'true'
        id: vault-auth
        name: Vault Authenticate
        run: vault-auth
      - if: needs.setup.outputs.is-ent-branch == 'true'
        id: vault-secrets
        name: Fetch Vault Secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          secrets: |
            kv/data/github/${{ github.repository }}/github-token token | ELEVATED_GITHUB_TOKEN;
      - uses: ./.github/actions/set-up-go
        with:
          github-token: ${{ needs.setup.outputs.is-ent-branch != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
          no-save: true
      - uses: ./.github/actions/install-tools # for buf and protoc-*
      - name: Check generate delta
        run: make prep check-proto-delta

  format:
    name: Format
    runs-on: ${{ github.repository == 'hashicorp/vault' && 'ubuntu-latest' || fromJSON('["self-hosted","ubuntu-22.04-x64"]') }}
    needs: setup
    permissions:
      contents: read
      id-token: write
    if: |
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_app') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_tests') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'proto') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'quality_code')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.setup.outputs.is-ent-branch == 'true'
        id: vault-auth
        name: Vault Authenticate
        run: vault-auth
      - if: needs.setup.outputs.is-ent-branch == 'true'
        id: vault-secrets
        name: Fetch Vault Secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          secrets: |
            kv/data/github/${{ github.repository }}/github-token token | ELEVATED_GITHUB_TOKEN;
      - uses: ./.github/actions/set-up-go
        with:
          github-token: ${{ needs.setup.outputs.is-ent-branch != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
          no-save: true
      - uses: ./.github/actions/install-tools # for buf and gofumpt
      - name: Go format
        run: make prep check-go-fmt
      - name: Protobuf format
        run: |
          echo "Using buf version $(buf --version)"
          make check-proto-fmt

  semgrep:
    name: Semgrep
    runs-on: ${{ github.repository == 'hashicorp/vault' && 'ubuntu-latest' || fromJSON('["self-hosted","ubuntu-22.04-x64"]') }}
    needs: setup
    if: |
      needs.setup.outputs.workflow-trigger == 'schedule' ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_app') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_tests') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'quality_code')
    container:
      image: returntocorp/semgrep@sha256:cfad18cfb6536aa48ad5a71017207a10320b4e17e3b2bd7b7de27b42dc9651e7 #v1.58
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep Rules
        run: semgrep ci --include '*.go' --config 'tools/semgrep/ci'

  semgrep-todo-check:
    name: Semgrep Todo checker
    runs-on: ${{ github.repository == 'hashicorp/vault' && 'ubuntu-latest' || fromJSON('["self-hosted","ubuntu-22.04-x64"]') }}
    needs: setup
    container:
      image: returntocorp/semgrep@sha256:cfad18cfb6536aa48ad5a71017207a10320b4e17e3b2bd7b7de27b42dc9651e7 #v1.58
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for TODO comments in diff (non-blocking)
        continue-on-error: true
        run: |
          semgrep ci \
            --include '*.go' \
            --include '*.sh' \
            --include '*.hcl' \
            --include '*.yml' \
            --include '*.yaml' \
            --include '*.proto' \
            --config 'tools/semgrep/ci/todo-comment.yml' \
            --baseline-commit "$(git merge-base HEAD FETCH_HEAD)"

  # FIPS Phase 4 (WO-056) regression gate: re-checks, with dedicated Go
  # analysis tools, the same categories of FIPS 140-3 regression that could
  # otherwise silently undo the Phase 2/Phase 3 remediation already landed
  # (WO-029 TLS cipher suite gating, WO-033 semgrep/depguard crypto import
  # rules, WO-046 UBI FIPS-path container image):
  #   * crypto-algorithm-check: disallowed crypto imports on FIPS-relevant
  #     Go paths (vault/, sdk/helper/keysutil/, builtin/logical/) without a
  #     //fips:exception comment.
  #   * dependency-audit: go.mod dependencies whose GitHub repository has
  #     been archived.
  #   * tls-config-check: a tls_min_version regression below TLS 1.2.
  #   * container-image-check: a FIPS-path Dockerfile stage using an
  #     Alpine/musl base image instead of a glibc-based one (see the
  #     vault_artifact_container_alpine / vault_artifact_container_ubi
  #     enos qualities in enos/k8s/enos-qualities.hcl).
  #
  # Phased rollout: every step below runs with
  # `continue-on-error: ${{ inputs.fips_gate_blocking != 'true' }}`, which is
  # advisory (true) by default -- findings are reported in the job output
  # but never fail the PR. This lets teams see and fix findings for two
  # weeks after this job first ships before it starts blocking merges. To
  # switch a run to blocking mode, manually dispatch this workflow
  # (workflow_dispatch) with fips_gate_blocking set to "true". Once the
  # two-week advisory window has elapsed, flip the `default` above to
  # "true" so pull_request/push runs block automatically. Tracked in
  # docs/fips/risk-register.md.
  fips-regression-gate:
    name: FIPS regression gate
    runs-on: ${{ github.repository == 'hashicorp/vault' && 'ubuntu-latest' || fromJSON('["self-hosted","ubuntu-22.04-x64"]') }}
    needs: setup
    permissions:
      contents: read
      id-token: write
    if: |
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_app') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_tests') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'quality_code')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: needs.setup.outputs.is-ent-branch == 'true'
        id: vault-auth
        name: Vault Authenticate
        run: vault-auth
      - if: needs.setup.outputs.is-ent-branch == 'true'
        id: vault-secrets
        name: Fetch Vault Secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          secrets: |
            kv/data/github/${{ github.repository }}/github-token token | ELEVATED_GITHUB_TOKEN;
      - name: Set up the pipeline tool
        uses: ./.github/actions/set-up-pipeline
        with:
          github-token: ${{ needs.setup.outputs.is-ent-branch != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
      - name: crypto-algorithm-check
        id: crypto-algorithm-check
        continue-on-error: ${{ inputs.fips_gate_blocking != 'true' }}
        run: pipeline fips-crypto-check
      - name: dependency-audit
        id: dependency-audit
        continue-on-error: ${{ inputs.fips_gate_blocking != 'true' }}
        env:
          GITHUB_TOKEN: ${{ needs.setup.outputs.is-ent-branch != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
        run: pipeline fips-dep-audit
      - name: tls-config-check
        id: tls-config-check
        continue-on-error: ${{ inputs.fips_gate_blocking != 'true' }}
        run: pipeline fips-tls-check
      - name: container-image-check
        id: container-image-check
        continue-on-error: ${{ inputs.fips_gate_blocking != 'true' }}
        run: pipeline fips-container-check
