---
name: fips-image-verify

# FIPS 140-3 Phase 3 (WO-046, quality gate FIPS-CONTAINER-001)
#
# Builds the Community/OSS FIPS-path UBI container image (Dockerfile `ubi`
# target) and runs container smoke tests confirming the OpenSSL 3.x FIPS
# provider is installed, activated, and passes its self-test. This is a
# verification-only gate -- it does not publish images and is independent
# of the release containerize pipeline in build.yml.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - Dockerfile
      - .release/docker/**
      - .github/workflows/fips-image-verify.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .release/docker/**
      - .github/workflows/fips-image-verify.yml

permissions:
  contents: read

jobs:
  build-and-verify-fips-image:
    name: build & verify FIPS-path UBI image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: vars
        name: Compute image tag
        run: |
          version="$(cat version/VERSION)"
          {
            echo "version=${version}"
            echo "image-tag=vault:${version}-fips"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: ./.github/actions/set-up-go
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build vault binary (linux/amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist/linux/amd64
          go build -o dist/linux/amd64/vault .

      - name: Build FIPS-path UBI image
        run: |
          docker build --target ubi \
            --build-arg BIN_NAME=vault \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=amd64 \
            --build-arg PRODUCT_VERSION="${{ steps.vars.outputs.version }}" \
            --build-arg PRODUCT_REVISION="${{ github.sha }}" \
            --build-arg LICENSE_SOURCE=LICENSE \
            --build-arg LICENSE_DEST=/usr/share/doc/vault/LICENSE.txt \
            -t "${{ steps.vars.outputs.image-tag }}" .

      - name: Smoke test -- base image is glibc UBI, not Alpine/musl
        run: |
          docker run --rm --entrypoint sh "${{ steps.vars.outputs.image-tag }}" -c '
            set -e
            grep -qi "Red Hat Enterprise Linux" /etc/os-release
            ! command -v apk >/dev/null 2>&1
          '

      - name: Smoke test -- openssl version is 3.x
        run: |
          docker run --rm --entrypoint sh "${{ steps.vars.outputs.image-tag }}" -c \
            'openssl version | grep -q "^OpenSSL 3\."'

      - name: Smoke test -- FIPS provider is active ('openssl list -providers')
        run: |
          docker run --rm --entrypoint sh "${{ steps.vars.outputs.image-tag }}" -c \
            'openssl list -providers | grep -q "^[[:space:]]*fips$"'

      - name: Smoke test -- FIPS self-test ('openssl fipsinstall -verify' equivalent)
        run: |
          # AC-4 calls for `openssl fipsinstall -verify` (or an equivalent
          # self-test command) to exit 0. Red Hat's OpenSSL build disables
          # the upstream `fipsinstall` subcommand entirely on this image
          # ("This command is not enabled in the Red Hat Enterprise Linux
          # OpenSSL build") -- confirmed against this exact Dockerfile
          # target during WO-046, see .release/docker/openssl-fips.cnf.
          # The Red Hat-equivalent self-test proof is a FIPS-restricted
          # cryptographic operation succeeding through the fips provider:
          # if the module's internal self-test had failed, OpenSSL would
          # not report it "active" and/or this command would fail.
          docker run --rm --entrypoint sh "${{ steps.vars.outputs.image-tag }}" -c \
            'echo -n "ci-fips-self-test" | openssl dgst -sha256 -provider fips -propquery fips=yes'
