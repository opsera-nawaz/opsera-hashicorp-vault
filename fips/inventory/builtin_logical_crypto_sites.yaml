        engine_or_method: pki

      - file: builtin/logical/pki/parsing/asn1.go
        line_range: "N/A"
        function: (ASN.1 helpers)
        algorithm: ASN.1 DER encoding helpers supporting X.509 extension parsing
        library: encoding/asn1
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Low-level ASN.1 support for certificate/CSR extension parsing
