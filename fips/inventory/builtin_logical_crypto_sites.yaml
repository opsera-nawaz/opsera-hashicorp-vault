          intermediate key_type=ed25519 under FIPS builds).
        engine_or_method: pki

      - file: builtin/logical/pki/ca_util.go
        line_range: "122-289"
        function: generateCABundle, generateCSRBundle, getKeyTypeAndBitsFromPublicKeyForRole
        algorithm: CA/CSR key-material bundling and RSA/ECDSA/Ed25519 public-key type detection
        library: "crypto/ecdsa, crypto/rsa, crypto/ed25519, crypto (crypto.PublicKey)"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Builds the ParsedCertBundle/ParsedCSRBundle used to generate new
          CA certs or CSRs, and type-switches an existing public key
          (line 268-280) across *rsa.PublicKey / *ecdsa.PublicKey /
          ed25519.PublicKey to determine role parameters. Security-relevant:
          drives CA key generation and existing-key onboarding.
        engine_or_method: pki

      - file: builtin/logical/pki/issuing/signing_utils.go
        line_range: "82-155"
        function: SigningParamsForKey, IsRSAPSS, HashFunc
        algorithm: Signature-algorithm selection for RSA/ECDSA/Ed25519 signers
        library: "crypto/rsa, crypto/ecdsa, crypto/ed25519, crypto/elliptic, crypto/x509, crypto/x509/pkix"
        security_relevant: true
        fips_approved: false
        classification_rationale: >-
          SigningParamsForKey (line 82) type-switches a crypto.Signer's
          public key to choose the X.509 SignatureAlgorithm (SHA256WithRSA,
          ECDSAWithSHA256/384/521, or PureEd25519 for ed25519.PublicKey at
          line 105). Security-relevant: determines the signature scheme used
          to sign every certificate/CRL issued by this mount. Ed25519 branch
          is not FIPS-approved; RSA/ECDSA branches are.
        engine_or_method: pki

      - file: builtin/logical/pki/issuing/roles.go
        line_range: "104-343"
        function: RoleEntry methods, WithSignatureBits, WithKeyUsage
        algorithm: Role configuration for key type/usage/signature-bits (consumed by signing_utils.go)
        library: encoding/asn1
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Stores/validates the role-level key_type, key_bits, signature_bits,
