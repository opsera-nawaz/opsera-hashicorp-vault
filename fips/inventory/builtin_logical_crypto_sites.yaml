summary:
  engines_required_by_ac: 16
  engines_present_in_repo: 9 # transit, pki(+pkiext), database, aws, ssh, totp, consul, nomad, rabbitmq
  engines_not_present_in_repo: 7 # kv, gcp, azure, ldap, terraform, ad, alicloud (externalized plugin modules)
  md5_usages_found: 0
  sha1_usages_found: 1 # builtin/logical/transit/path_import.go:472 (see entry above)
  security_relevant_findings_flagged_for_phase2:
    - "builtin/logical/pki/path_root.go:773-828 — Ed25519 root/intermediate CA issuance (not FIPS-approved)"
    - "builtin/logical/pki/issuing/signing_utils.go:82-155 — Ed25519 signature-algorithm branch"
    - "builtin/logical/pki/path_revoke.go:458-509 — Ed25519 key-match branch in revoke-with-key"
    - "builtin/logical/pki/acme_challenges.go:540-554 — ChaCha20-Poly1305 in ACME TLS-ALPN-01 client cipher allowlist"
    - "builtin/logical/pki/export_crypto.go:202-353 — Ed25519/ML-KEM key-export eligibility (ML-KEM/FIPS203 itself is approved; noted for Phase 3 module-boundary review)"
    - "builtin/logical/transit/path_import.go:469-481 — SHA-1 selectable as RSA-OAEP hash for BYOK import"
    - "builtin/logical/transit/path_byok.go:158-214 — Ed25519 key-type export eligibility"
    - "builtin/logical/database/credentials.go:303-381 — Ed25519 client-certificate key_type option"
    - "builtin/logical/ssh/path_config_ca.go:356-455 and path_issue_sign.go:490-553 — Ed25519 SSH CA key/signing option"
    - "builtin/logical/totp/*.go — SHA-1 is the default HOTP/TOTP algorithm (github.com/pquerna/otp)"
