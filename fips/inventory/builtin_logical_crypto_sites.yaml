# FIPS 140-3 Phase 1 Cryptographic Inventory — builtin/logical/ (secrets engines)
#
# WO-007: Scan builtin engines and auth for crypto imports.
# Produced by a systematic scan of every file under builtin/logical/ in this
# repository (opsera-nawaz/opsera-hashicorp-vault, branch feature/WO-007,
# based on hashicorp/vault) for crypto/*, golang.org/x/crypto/*, and adjacent
# security-relevant imports (encoding/asn1, github.com/hashicorp/vault/helper/pkcs7).
#
# Scope note: the 16 engine names required by this work order's acceptance
# criteria (transit, pki, kv, database, aws, gcp, azure, ssh, totp, consul,
# nomad, rabbitmq, ldap, terraform, ad, alicloud) reflect Vault's full secrets
# engine catalog across its history. In THIS repository snapshot, only 9 of
# those 16 are vendored as builtin/logical/<name> Go packages; the remaining
# 7 were externalized into separate go modules and are pinned in go.mod but
# have no source tree under builtin/ to scan. Both cases are recorded below
# so the 16-engine catalog is complete; see each entry's `status` field.
#
# Validate with: fips/scripts/validate_inventory_schema.sh
#   fips/inventory/builtin_logical_crypto_sites.yaml
#
# Cross-references:
#   - Transit's core encrypt/decrypt/sign/verify/HMAC key operations are
#     implemented in sdk/helper/keysutil/policy.go and are cataloged in
#     keysutil_policy_crypto_sites.yaml (WO-005), not duplicated here.
#   - crypto-relevant third-party dependency versions (golang.org/x/crypto,
#     tink-go, layeh.com/radius, etc.) are cross-checked in full by WO-009
#     (go list -m all dependency audit).

schema_version: 1
work_order: WO-007
scan_scope: builtin/logical/
file_count_scanned: 317 # find builtin/logical -name '*.go' | wc -l

engines:

  # --------------------------------------------------------------------------
  transit:
    directory: builtin/logical/transit
    file_count: 56
    note: >-
      Transit engine crypto operations are cataloged in
      keysutil_policy_crypto_sites.yaml. The entries below cover code that is
      physically in builtin/logical/transit/ and imports crypto packages
      directly (BYOK export/import, RSA wrapping-key management, the
      hash-as-a-service and hmac-as-a-service endpoints, and CSR/cert-chain
      handling for externally-signed transit keys). Core Encrypt/Decrypt/
      Sign/Verify/HMAC key-material operations delegate to
      sdk/helper/keysutil/policy.go and are NOT duplicated here.
    entries:
      - file: builtin/logical/transit/path_hash.go
        line_range: "20-147"
        function: pathHash, pathHashWrite
        algorithm: SHA-2 (224/256/384/512)
        library: crypto/sha256, crypto/sha512
        security_relevant: false
        fips_approved: true
        classification_rationale: >-
          General-purpose hash-as-a-service endpoint (POST
          transit/hash/:urlalgorithm). Vault computes a digest of
          caller-supplied input and returns it; Vault itself makes no
          authorization or integrity decision based on the digest, so this is
          non-security from Vault's perspective. All four selectable
          algorithms (SHA-2 family) are FIPS-approved; no MD5 or SHA-1 option
          is offered on this path.
        engine_or_method: transit

      - file: builtin/logical/transit/path_hmac.go
        line_range: "115-440"
        function: pathHMACWrite, pathHMACVerify
        algorithm: HMAC (SHA-2 family, algorithm selectable)
        library: crypto/hmac
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          HMAC-as-a-service endpoint. Unlike Encrypt/Decrypt/Sign, the
          hmac.New(hashAlg, key) call at path_hmac.go:219 and :399 is made
          directly in this file rather than via a keysutil.Policy method,
          using key material read from the transit key's Policy (`key`
          variable sourced from p.Keys[ver]). Security-relevant because the
          resulting MAC is used by callers to authenticate data integrity.
          HMAC-SHA2 is FIPS-approved.
        engine_or_method: transit

      - file: builtin/logical/transit/path_byok.go
        line_range: "158-214"
        function: getBYOKExportKey
        algorithm: RSA-OAEP / ECDH-wrap / Ed25519 key wrapping (delegates to keysutil.Policy.WrapKey)
        library: "crypto/ecdsa, crypto/ed25519, crypto/elliptic"
        security_relevant: true
        fips_approved: false
        classification_rationale: >-
          Builds the target key (RSA/ECDSA/Ed25519/symmetric) to hand to
          dstP.WrapKey for Bring-Your-Own-Key export to another transit
          instance/HSM. Security-relevant: this is direct handling of raw
          private key material. Marked fips_approved false only insofar as
          KeyType_ED25519 keys are eligible for export via this path
          (Ed25519 is not a FIPS 140-3 Approved signature algorithm); RSA and
          ECDSA (NIST curves) exported via the same function are Approved.
        engine_or_method: transit

      - file: builtin/logical/transit/path_import.go
        line_range: "390-433"
        function: decryptImportedKey
        algorithm: RSA-OAEP unwrap (ephemeral key) + AES-KWP unwrap (SP 800-38F)
        library: "crypto/rsa, github.com/tink-crypto/tink-go/v2/kwp/subtle"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Implements the two-stage BYOK unwrap for importing external key
          material into Transit: rsa.DecryptOAEP (line ~407) unwraps a
          256-bit ephemeral AES key with the instance's RSA-4096 wrapping
          private key, then tink-go's AES-KWP (NIST SP 800-38F Key Wrap with
          Padding, line ~424) unwraps the actual key material. Both steps
          protect confidentiality of imported key material — security
          relevant. AES-KWP and RSA-OAEP-SHA256 are FIPS-approved; see the
          separate SHA-1 entry below for the OAEP hash function choice.
        engine_or_method: transit

      - file: builtin/logical/transit/path_import.go
        line_range: "469-481"
        function: parseHashFn
        algorithm: SHA-1 (also offers SHA-224/256/384/512)
        library: crypto/sha1
        security_relevant: true
        fips_approved: false
        classification_rationale: >-
          SHA-1 usage classified individually per FIPS-CRYPTO-002 (no
          bulk-flagging). sha1.New() at line 472 is one of five selectable
          OAEP mask/hash functions for the RSA-OAEP unwrap in
          decryptImportedKey (used when a caller sets hash_function=SHA1 on
          `transit/keys/:name/import`). This is security-relevant: it is part
          of the algorithm that protects imported private-key material in
          transit. SHA-1 is not FIPS 140-3 Approved for this purpose — flag
          for Phase 2 remediation: restrict hash_function to SHA-256+ (ideally
          reject SHA1) when running in FIPS mode.
        engine_or_method: transit

      - file: builtin/logical/transit/path_wrapping_key.go
        line_range: "37-96"
        function: pathWrappingKeyRead, getWrappingKey
        algorithm: RSA-4096 (key retrieval/generation delegates to keysutil.Policy)
        library: "crypto/rsa, crypto/x509"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Retrieves (creating on first use, via keysutil.PolicyRequest with
          KeyType_RSA4096) the RSA wrapping key pair whose public half
          callers use to encrypt key material before import/BYOK-export.
          x509.MarshalPKIXPublicKey encodes the public key for the HTTP
          response. Security-relevant: this key is the root of trust for the
          BYOK import protocol. RSA-4096 is FIPS-approved. Key generation
          itself happens inside keysutil (cross-reference
          keysutil_policy_crypto_sites.yaml); this entry covers the
          transit-local read/encode path only.
        engine_or_method: transit

      - file: builtin/logical/transit/path_export.go
        line_range: "301-419"
        function: encodeRSAPrivateKey, encodeRSAPublicKey, keyEntryToECPrivateKey, keyEntryToECPublicKey
        algorithm: RSA / ECDSA (NIST P-256/P-384/P-521) key PEM encoding
        library: "crypto/ecdsa, crypto/elliptic, crypto/x509"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Encodes exported transit key material (private and public) into
          PEM using x509.MarshalPKCS8PrivateKey / MarshalPKIXPublicKey ahead
          of return to an authorized `transit/export/*` caller.
          Security-relevant: handles raw private key bytes. RSA and NIST
          curve ECDSA are FIPS-approved; see path_byok.go entry above for the
          Ed25519 export case handled by the shared WrapKey path.
        engine_or_method: transit

      - file: builtin/logical/transit/path_datakey.go
        line_range: "91-214"
        function: pathDatakeyWrite, generateDataKey
        algorithm: envelope encryption data key generation (delegates ciphertext wrapping to keysutil.Policy.Encrypt)
        library: crypto/rand
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Generates a random plaintext data key for envelope encryption and
          calls into the transit key Policy to wrap it. Security-relevant:
          this is the entry point for the `transit/datakey` envelope
          encryption pattern used by callers to protect their own data.
          crypto/rand is a CSPRNG; the actual AEAD wrap is cataloged in
          keysutil_policy_crypto_sites.yaml.
        engine_or_method: transit

      - file: builtin/logical/transit/path_sign_verify.go
        line_range: "354-380"
        function: getSaltLength
        algorithm: RSA-PSS salt length parameter parsing (rsa.PSSSaltLengthAuto / PSSSaltLengthEqualsHash)
        library: crypto/rsa
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Parses the caller-supplied `salt_length` request parameter into the
          crypto/rsa PSS salt-length constants consumed by
          keysutil.Policy.Sign for RSA-PSS signatures. Security-relevant:
          salt length is a signature-scheme parameter. The actual PSS
          signing call is cataloged in keysutil_policy_crypto_sites.yaml
          (cross-reference); this entry covers only the parameter-parsing
          code that lives in builtin/logical/transit/.
        engine_or_method: transit

      - file: builtin/logical/transit/path_keys.go
        line_range: "304-344"
        function: keyPolicyObservationMetadata
        algorithm: NIST curve name lookup for telemetry (elliptic.P256/P384/P521)
        library: crypto/elliptic
        security_relevant: false
        fips_approved: true
        classification_rationale: >-
          Uses elliptic.P256()/P384()/P521().Params().Name only to produce a
          human-readable curve name string for observation/metadata
          reporting (line ~490-494). No cryptographic operation is performed
          with the curve — non-security, display/telemetry only.
        engine_or_method: transit

      - file: builtin/logical/transit/path_certificates.go
        line_range: "96-312"
        function: pathCreateCsrWrite, pathImportCertChainWrite, parseCsr, parseCertificateChain
        algorithm: X.509 CSR generation and certificate chain parsing for externally-signed transit keys
        library: crypto/x509
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Supports `transit/keys/:name/csr` and
          `transit/keys/:name/set-certificate`, letting a transit signing key
          be re-parented under an external CA. Parses/validates X.509
          CSRs and certificate chains that establish trust for the key's
          public material — security-relevant input validation.
        engine_or_method: transit

      - file: sdk/helper/keysutil/policy.go
        line_range: "N/A"
        function: "Policy.Encrypt, Policy.Decrypt, Policy.Sign, Policy.VerifySignature, Policy.HMACWithManagedKey"
        algorithm: "AES-GCM, ChaCha20-Poly1305, ECDSA, Ed25519, RSA, HMAC (see keysutil inventory for full detail)"
        library: "crypto/aes, crypto/cipher, crypto/ecdsa, crypto/ed25519, crypto/rsa, crypto/hmac, golang.org/x/crypto/chacha20poly1305"
        security_relevant: true
        fips_approved: false
        classification_rationale: >-
          Cross-reference only, per WO-007 acceptance criterion: "Transit
          engine crypto operations are cataloged in
          keysutil_policy_crypto_sites.yaml." Every builtin/logical/transit
          path handler that performs core key-material Encrypt/Decrypt/
          Sign/Verify (path_encrypt.go, path_decrypt.go, path_sign_verify.go
          pathSignWrite/pathVerifyWrite, path_hmac.go's managed-key branch)
          calls through to this Policy on sdk/helper/keysutil, which is
          cataloged in full (per algorithm, per KeyType) by WO-005. This row
          intentionally does not restate those entries; fips_approved is a
          placeholder reflecting that the aggregate keysutil inventory
          contains both Approved (AES-GCM, RSA, ECDSA) and non-Approved
          (ChaCha20-Poly1305, Ed25519) key types — see that file for the
          per-KeyType breakdown.
        engine_or_method: transit
        status: cross_reference
        cross_reference: keysutil_policy_crypto_sites.yaml

  # --------------------------------------------------------------------------
  pki:
    directory: builtin/logical/pki
    file_count: 138
    note: >-
      Highest crypto-import density of any builtin engine. Entries below
      cover every non-test .go file (including the issuing/, parsing/, and
      revocation/ subpackages) that imports crypto/x509, crypto/ecdsa,
      crypto/rsa, crypto/ed25519, or an adjacent security-relevant package.
      Per acceptance criterion 8, all crypto/x509 / ecdsa / rsa / ed25519
      usages here are security_relevant: true.
    entries:
      - file: builtin/logical/pki/cert_util.go
        line_range: "552-650"
        function: generateCreationBundle
        algorithm: X.509 certificate signing input assembly (RSA/ECDSA/Ed25519 key-type dispatch)
        library: "crypto/x509, crypto/x509/pkix"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Central function that turns a role + CSR into the CreationBundle
          later signed by x509.CreateCertificate. Parses/validates the CSR
          (x509.ParseCertificateRequest, x509.ParsePKCS1PrivateKey/
          ParseECPrivateKey at lines 422, 609, 611) and resolves the target
          key type. Security-relevant: this is the core certificate-issuance
          code path. RSA and ECDSA are FIPS-approved; Ed25519 issuance
          (also handled by this dispatch) is not — see path_root.go entry.
        engine_or_method: pki

      - file: builtin/logical/pki/issuing/issue_common.go
        line_range: "103-435"
        function: GenerateCreationBundle
        algorithm: X.509 certificate creation-bundle assembly (shared package-level implementation)
        library: crypto/x509
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Package-level counterpart to cert_util.go's generateCreationBundle,
          shared across role/CA code paths; also parses custom OIDs via
          x509.ParseOID (line 435) for extra-names extensions.
          Security-relevant: feeds the certificate signing operation.
        engine_or_method: pki

      - file: builtin/logical/pki/path_root.go
        line_range: "773-828"
        function: (generateCert helper), publicKeyType
        algorithm: X.509 self-signed CA certificate creation and signature-algorithm selection (RSA-SHA256, ECDSA-SHA256/384/512, Ed25519)
        library: "crypto/x509, crypto/rand, crypto/rsa, crypto/ecdsa, crypto/ed25519, crypto/elliptic"
        security_relevant: true
        fips_approved: false
        classification_rationale: >-
          x509.CreateCertificate(rand.Reader, ...) at line 773 signs new root
          CA certificates; publicKeyType (line 809) maps the CA key's type to
          a signature algorithm, including x509.PureEd25519 for
          ed25519.PublicKey (line 827-828). Security-relevant: this issues
          the trust anchor for the whole PKI mount. RSA-SHA256 and
          ECDSA-SHA256/384/512 are FIPS-approved; Ed25519/PureEd25519 root
