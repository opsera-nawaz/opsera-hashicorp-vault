        engine_or_method: pki

      - file: builtin/logical/pki/issuing/issuers.go
        line_range: "133-155"
        function: IssuerEntry.GetCertificate
        algorithm: X.509 issuer certificate parsing/storage
        library: crypto/x509
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          IssuerEntry.RevocationSigAlg (x509.SignatureAlgorithm field) and
          GetCertificate parse the stored issuer's PEM into an
          *x509.Certificate. Security-relevant: this is the CA identity used
          to sign every leaf certificate/CRL/OCSP response for the issuer.
        engine_or_method: pki

      - file: builtin/logical/pki/issuing/audit_utils.go
        line_range: "14-40"
        function: AddCertificateFieldsToAuditData
        algorithm: X.509 certificate field extraction for audit logging
        library: crypto/x509
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Reads fields off an *x509.Certificate to enrich Vault's audit log
