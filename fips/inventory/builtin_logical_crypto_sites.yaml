        line_range: "33-77"
        function: RevokeCert (interface), AssociateRevokedCertWithIsssuer, FetchIssuerMapForRevocationChecking
        algorithm: X.509 revocation bookkeeping (issuer/serial association)
        library: crypto/x509
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Associates revoked *x509.Certificate values with their issuing CA
