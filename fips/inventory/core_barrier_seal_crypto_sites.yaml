# --- Explicit scope clarifications required by the acceptance criteria ---
scope_notes:
  - id: shamir-directory-does-not-exist
    finding: >
      vault/shamir/ does NOT exist as a directory anywhere in this repository
      checkout. Verified via `ls vault/shamir` (no such file or directory) and
      `find . -iname '*shamir*'`. Shamir's Secret Sharing logic instead lives
      in two places: (1) the top-level package github.com/hashicorp/vault/shamir
      (files shamir/shamir.go, shamir/shamir_test.go), which implements the
      GF(256) polynomial split/combine math and is called from
      vault/rekey.go (shamir.Split / shamir.Combine / shamir.ShareOverhead);
      and (2) vault/seal/seal.go, which type-asserts a wrapping.Wrapper to
      *aead.ShamirWrapper (github.com/hashicorp/go-kms-wrapping/v2/aead) to
      set/read the AES-GCM key derived from the combined Shamir secret
      (SetShamirSealKey / GetShamirKeyBytes, seal.go:817-845).
  - id: seal-wrapper-go-path-gap
    finding: >
      The literal path vault/seal_wrapper.go named in the work-order edge
      case does NOT exist (confirmed: `wc -l vault/seal_wrapper.go` ->
      "No such file or directory"). A similarly-named but distinct file,
      vault/seal/seal_wrapper.go (145 lines), does exist in the vault/seal
      sub-package and defines the SealWrapper struct used throughout
      vault/seal/seal.go (GetAllSealWrappersByPriority, etc). It performs a
      round-trip health-check Encrypt/Decrypt call against the underlying
      KMS wrapper at seal_wrapper.go:116 and seal_wrapper.go:124
      (`sw.Wrapper.Encrypt(...)` / `sw.Wrapper.Decrypt(...)`). This file is
      OUTSIDE the five files in this story's direct scope, so no per-line
      entries were added for it below, but it is flagged here per the
      work order's instruction to document the gap rather than silently
      omit it.
  - id: awskms-import-version-skew-not-reproduced
    finding: >
      The work order's technical_details/edge_cases asserted a tech-debt
      finding of "awskms v4 in core.go vs v2 in configutil/kms.go". This was
      checked against the actual current source and does NOT reproduce:
      vault/core.go:35 imports
      "github.com/hashicorp/go-kms-wrapping/wrappers/awskms/v4", and
      internalshared/configutil/kms.go:23 also imports the same
      awskms/v4 path. go.mod (line 114) and go.sum both pin a single
      resolved version, v4.0.4, with no v2 reference anywhere in the module
      graph for awskms (verified via `grep -rn 'awskms/v2\|awskms/v3\|awskms/v4'`
      across all non-test .go files and `grep 'awskms' go.sum`). Recorded here
      as a corrected/superseded finding for the WO-019 aggregate inventory
      rather than silently dropped, since the original hypothesis does not
      hold for this codebase snapshot.

