# FIPS 140-3 Cryptographic Inventory - Core / Barrier / Seal modules
# Work order: WO-006 "Catalog crypto in core barrier seal modules"
# Requirement: FIPS-CRYPTO-001 (Cryptographic Module Boundary mapping)
# Schema: fips/schemas/crypto_inventory_entry.json
#
# Scope: vault/core.go, vault/barrier_aes_gcm.go, vault/seal_autoseal.go,
# vault/seal/seal.go, vault/rekey.go.
#
# Every entry was verified by reading the exact file:line in this repository
# checkout (branch feature/WO-006, hashicorp/vault fork). module_boundary
# values:
#   barrier-internal    - inside AESGCMBarrier; the barrier's own AES-256-GCM
#                          encryption-at-rest implementation.
#   seal-external-kms    - delegates to an external KMS/HSM via the
#                          go-kms-wrapping Access/Wrapper interfaces (AWS KMS,
#                          Azure Key Vault, GCP Cloud KMS, PKCS#11, etc).
#   seal-shamir          - Shamir's Secret Sharing manual-unseal path, either
#                          the split/combine math (vault/rekey.go, top-level
#                          shamir/ package) or the go-kms-wrapping
#                          aead.ShamirWrapper that AES-GCM-encrypts the root
#                          key under the reconstructed Shamir secret.
#   core-orchestration   - vault/core.go wiring: TLS, x509/ecdsa cluster
#                          identity, constant-time comparisons, and
#                          construction/handoff of barrier and seal objects.
#
# fips_approved reflects algorithm-level FIPS 140-3 approval status (per
# SP 800-140C), not CMVP validation of this specific Go binary/build - that
# is out of scope for this Phase 1 inventory story and is addressed by later
# FIPS phases (validated module boundary, Phase 3).

