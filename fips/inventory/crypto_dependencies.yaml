excluded_graph_only_nodes:
  description: >
    Modules that appear in the full `go list -m all` module graph for one or
    more of the four in-scope go.mod files but (a) are not present in any of
    those four go.mod require blocks, and (b) are confirmed via
    `go mod why -m` as not needed by the main module for compilation. These
    do not introduce cryptographic functionality into the built Vault binary
    and are excluded from the `entries` list per the WO-009 scoping constraint.
  entries:
    - module_path: github.com/golang-jwt/jwt
      version: v3.2.1+incompatible
      evidence: "go mod why -m github.com/golang-jwt/jwt -> \"main module does not need module github.com/golang-jwt/jwt\""
    - module_path: github.com/miekg/pkcs11
      version: v1.1.1
      evidence: "go mod why github.com/miekg/pkcs11 -> \"main module does not need package github.com/miekg/pkcs11\""
    - module_path: github.com/letsencrypt/pkcs11key/v4
      version: v4.0.0
      evidence: "go mod why github.com/letsencrypt/pkcs11key/v4 -> \"main module does not need package github.com/letsencrypt/pkcs11key/v4\""
    - module_path: github.com/google/go-pkcs11
      version: v0.3.0
      evidence: "go mod why github.com/google/go-pkcs11 -> \"main module does not need package github.com/google/go-pkcs11\""

pkcs11_boundary_confirmation:
  wrapper_module: github.com/hashicorp/go-kms-wrapping/wrappers/pkcs11
  present_in_root_go_mod: false
  finding: >
    `github.com/hashicorp/go-kms-wrapping/wrappers/pkcs11` does not appear
    anywhere in `go.mod`'s require block or in the resolved
    `GOWORK=off go list -m all` module graph for the root module. The three
    generic PKCS#11 libraries that do appear in the graph
    (github.com/miekg/pkcs11, github.com/letsencrypt/pkcs11key/v4,
    github.com/google/go-pkcs11 — see excluded_graph_only_nodes) are
    unreachable transitive artifacts of unrelated dependencies and are not
    imported by any Vault package (`go mod why` confirms "main module does
    not need package" for each). This confirms Vault Community Edition (CE)
    excludes HSM/PKCS#11 integration — that capability is Enterprise-only
    and is out of scope for the CE cryptographic boundary this inventory
    describes.
