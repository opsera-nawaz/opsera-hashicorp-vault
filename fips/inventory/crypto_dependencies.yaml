# FIPS 140-3 Phase 1 — Cryptographic Dependency Inventory
#
# WO-009: Identify crypto-relevant dependencies via `go list` classification.
# Satisfies quality gate FIPS-DEP-001 (dependency identification). Feeds the
# capstone aggregate inventory produced by WO-019.
#
# This is a classification artifact only. It does NOT upgrade, consolidate,
# or modify any dependency version.
#
# Methodology
# -----------
# 1. `GOWORK=off go list -m all` was run independently in each of the four
#    module roots (workspace mode is disabled per-module because the repo's
#    go.work file otherwise pulls tools/pipeline's unrelated, unresolvable
#    github.com/hashicorp/releases-api dependency into every module's build
#    list — see "known_limitations" below).
# 2. Output was filtered for known crypto-relevant module path patterns
#    (golang.org/x/crypto, tink-crypto, cloudflare/circl, go-jose,
#    golang-jwt, go-kms-wrapping, go-secure-stdlib, lestrrat-go/jwx,
#    youmark/pkcs8, pkcs11/pkcs12).
# 3. Each go.mod (go.mod, sdk/go.mod, internalshared/go.mod,
#    tools/pipeline/go.mod) was read directly to determine direct
#    (no `// indirect` comment) vs. transitive status per module.
# 4. `grep -rn` over the Go source tree located actual import sites for each
#    dependency to identify the specific sub-packages/algorithms in use.
#    `go mod why -m <module>` was used to trace unreachable or deeply
#    transitive nodes.
# 5. FIPS-Approved status was assigned per the classification rule set:
#    AES-GCM=Approved, ChaCha20-Poly1305=Not Approved, ECDSA (NIST curves)=
#    Approved, Ed25519=Not Approved (non-NIST curve), RSA>=2048=Approved,
#    SHA-256/384/512=Approved, HKDF-SHA256=Approved.
# 6. Dependencies present only as unreachable module-graph artifacts (no
#    entry in any of the four go.mod require blocks, and confirmed via
#    `go mod why` as "main module does not need [package|module]") were
#    excluded from the dependency list below per the WO-009 constraint to
#    exclude transitive deps that introduce no cryptographic functionality
#    into the built binary. They are recorded in `excluded_graph_only_nodes`
#    for traceability.
# 7. Verification: a fresh, independent `GOWORK=off go list -m all` scan
#    (plus a tools/pipeline/go.mod read) filtered for the same patterns
#    produced 40 candidate module@version pairs. Diffed against every
#    module_path documented below (25 `entries` + 4
#    `excluded_graph_only_nodes`, 29 total), the only 11 unaccounted-for
#    candidates were github.com/hashicorp/go-secure-stdlib/{awsutil/v2,
#    fileutil, gatedwriter, kv-builder, mlock, parseutil, password,
#    permitpool, plugincontainer, regexp, strutil} — each individually
#    confirmed (`grep -rl '"crypto/' <module-cache-dir>/*.go`) to contain no
#    `crypto/*` stdlib import, i.e. general-purpose utilities that wrap no
#    cryptographic primitive. This closes the loop on AC #1's completeness
#    requirement with zero unexplained gaps.
#
# known_limitations:
#   - `go list -m all` cannot complete for tools/pipeline/go.mod (even with
#     GOWORK=off): it requires github.com/hashicorp/releases-api@v0.4.14,
#     whose GitHub repository is not resolvable from this environment
#     ("remote: Repository not found"). tools/pipeline's crypto-relevant
#     dependency set was therefore derived by reading tools/pipeline/go.mod
#     directly instead of via `go list`. Go 1.17+ module graph pruning means
#     go.mod already records the full direct+indirect requirement set needed
#     to build that module, so this substitution does not reduce coverage
#     for tools/pipeline's own crypto-relevant entries (it has exactly one:
#     golang.org/x/crypto, indirect).
#
