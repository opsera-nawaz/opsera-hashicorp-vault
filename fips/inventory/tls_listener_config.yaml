# FIPS 140-3 Phase 1 — Cryptographic Inventory and Discovery
# WO-008: TLS listener configuration inventory with protocol documentation
# Requirement: FIPS-TLS-001
#
# Scope: every TLS configuration point across api/client.go,
# internalshared/configutil/listener.go, and http/handler.go, plus the
# supporting wiring (internalshared/listenerutil/listener.go,
# helper/serverconfig/listener_tcp.go, vault/cluster/cluster.go, vault/core.go,
# helper/serverconfig/config.go) and inter-node TLS
# (physical/raft/raft.go, physical/raft/streamlayer.go,
# go-secure-stdlib/tlsutil v0.1.3), and the existing validation tooling in
# vault/diagnose (ListenerChecks()).
#
# This is a static source-code inventory only. It does NOT change any TLS
# behavior (Phase 2 scope) and does NOT constitute a runtime FIPS validation.
# Per FIPS-TLS-001, the actual negotiated protocol version and cipher suite
# in a live deployment must be confirmed via runtime verification (e.g.
# `vault operator diagnose`, which already invokes vault/diagnose.ListenerChecks(),
# or an external TLS scanner such as `openssl s_client` / `testssl.sh`) —
# source defaults documented here describe what the code will do, not what
# has been observed on the wire.
schema_version: "1.0"
work_order: WO-008
requirement_id: FIPS-TLS-001
epic: "FIPS Phase 1 — Cryptographic Inventory and Discovery"
generated: "2026-09-27"
