  - id: listener-tls-cipher-suites
    file: internalshared/configutil/listener.go
    line: "77-78, 556-562"
    component: api_listener
    listener_port: 8200
    config_parameter: tls_cipher_suites
    default_value: "\"\" (empty) — when unset, l.TLSCipherSuites stays nil and internalshared/listenerutil/listener.go:137 skips setting tlsConf.CipherSuites, so Go's crypto/tls default suite ordering for the negotiated version is used unfiltered"
    configurable_range: "Comma-separated list parsed by go-secure-stdlib/tlsutil.ParseCiphers (tlsutil.go v0.1.3:60-73) against a fixed 26-entry cipherMap spanning TLS_RSA_*, TLS_ECDHE_*, and TLS 1.3 suites (see cipher_suites below)."
    fips_compliant_default: false
    fips_gap: "No explicit FIPS-Approved cipher suite allowlist is enforced. AES-GCM/AES-CBC suites use FIPS-Approved algorithms but their FIPS 140-3 status additionally depends on a CMVP-validated crypto provider (Phase 3 / WO-010, WO-011 scope — Go stdlib crypto is not itself CMVP-validated). TLS_RSA_WITH_RC4_128_SHA, TLS_RSA_WITH_3DES_EDE_CBC_SHA, TLS_ECDHE_RSA_WITH_3DES_EDE_CBC_SHA, TLS_ECDHE_ECDSA_WITH_RC4_128_SHA, TLS_ECDHE_RSA_WITH_RC4_128_SHA, and the four ChaCha20-Poly1305 suites are non-Approved algorithms regardless of provider and are still selectable via this field. If tls_cipher_suites is left unset entirely (the default), the operator has no allowlist at all and Go's built-in default ordering (which can still negotiate ChaCha20-Poly1305 with a client that prefers it) applies."
    cipher_suites:
      - TLS_RSA_WITH_RC4_128_SHA                       # non-Approved (RC4)
      - TLS_RSA_WITH_3DES_EDE_CBC_SHA                   # non-Approved (3DES)
      - TLS_RSA_WITH_AES_128_CBC_SHA                    # AES (provider-dependent)
      - TLS_RSA_WITH_AES_256_CBC_SHA                    # AES (provider-dependent)
      - TLS_RSA_WITH_AES_128_CBC_SHA256                 # AES (provider-dependent)
      - TLS_RSA_WITH_AES_128_GCM_SHA256                 # AES-GCM (provider-dependent)
      - TLS_RSA_WITH_AES_256_GCM_SHA384                 # AES-GCM (provider-dependent)
      - TLS_ECDHE_ECDSA_WITH_RC4_128_SHA                # non-Approved (RC4)
      - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA            # AES (provider-dependent)
      - TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA            # AES (provider-dependent)
      - TLS_ECDHE_RSA_WITH_RC4_128_SHA                  # non-Approved (RC4)
      - TLS_ECDHE_RSA_WITH_3DES_EDE_CBC_SHA             # non-Approved (3DES)
      - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA               # AES (provider-dependent)
      - TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA               # AES (provider-dependent)
      - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256          # AES (provider-dependent)
      - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256            # AES (provider-dependent)
      - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256            # AES-GCM (provider-dependent)
      - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256          # AES-GCM (provider-dependent)
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384            # AES-GCM (provider-dependent)
      - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384          # AES-GCM (provider-dependent)
      - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305             # non-Approved (ChaCha20-Poly1305)
      - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305           # non-Approved (ChaCha20-Poly1305)
      - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256      # non-Approved (ChaCha20-Poly1305)
      - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256    # non-Approved (ChaCha20-Poly1305)
      - TLS_AES_128_GCM_SHA256                           # TLS 1.3, AES-GCM (provider-dependent)
      - TLS_AES_256_GCM_SHA384                           # TLS 1.3, AES-GCM (provider-dependent)
    notes: >
      Source: go-secure-stdlib/tlsutil v0.1.3 cipherMap (pinned in go.mod:135,
      go.sum:771-772; verified by extracting the cached module zip at
      github.com/hashicorp/go-secure-stdlib/tlsutil@v0.1.3/tlsutil.go:30-58).
      Note TLS 1.3's own three suites (TLS_AES_128_GCM_SHA256,
      TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256) are not
      independently selectable in Go's crypto/tls for TLS 1.3 connections —
      Go always offers all three regardless of CipherSuites — so setting
      tls_cipher_suites has no effect on TLS 1.3 cipher negotiation, only on
      TLS 1.2 and below. tlsutil also warns (internalshared/listenerutil/listener.go:143-164)
      if all/some configured suites are blacklisted by RFC 7540 Appendix A
      for HTTP/2, but this is an HTTP/2-compatibility warning, not a FIPS check.

