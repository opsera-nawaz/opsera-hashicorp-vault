schema_validation:
  script_expected_at: "fips/scripts/validate_inventory_schema.sh"
  script_present_in_this_branch: false
  note: >
    Neither fips/scripts/validate_inventory_schema.sh nor a shared JSON
    Schema for fips/inventory/*.yaml exists anywhere in this repository as
    of this verification (confirmed via repo-wide find for *schema* and
    *inventory*, and via `git ls-tree -r origin/main` — the fips/ directory
    does not exist on main). This scaffold is presumably delivered by
    another work order in the same epic (e.g. the capstone inventory work
    order) that has not yet been merged. Step 7 of this work order's
    implementation_steps ("Run fips/scripts/validate_inventory_schema.sh
    against the new verification file") could therefore not be executed —
    this is a genuine environmental gap, not a skipped step. As a
    substitute, this file's YAML syntax was validated with
    `python3 -c "import yaml; yaml.safe_load(open('fips/inventory/ce_fips_build_tag_verification.yaml'))"`,
    which completed without error. Once the shared schema/script lands on
    main, this file should be re-validated against it.
