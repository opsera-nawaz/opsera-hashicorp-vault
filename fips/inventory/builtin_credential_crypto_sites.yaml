# FIPS 140-3 Phase 1 Cryptographic Inventory — builtin/credential/ (auth methods)
#
# WO-007: Scan builtin engines and auth for crypto imports.
# Produced by a systematic scan of every file under builtin/credential/ in
# this repository (opsera-nawaz/opsera-hashicorp-vault, branch
# feature/WO-007, based on hashicorp/vault) for crypto/*,
# golang.org/x/crypto/*, and adjacent security-relevant imports.
#
# All 9 auth methods named in this work order's acceptance criteria
# (approle, aws, cert, ldap, userpass, okta, github, radius, token) are
# vendored under builtin/credential/ in this repository — unlike the
# secrets-engine side, there is no "externalized module" gap here.
#
# Validate with: fips/scripts/validate_inventory_schema.sh
#   fips/inventory/builtin_credential_crypto_sites.yaml

schema_version: 1
work_order: WO-007
scan_scope: builtin/credential/
file_count_scanned: 93 # find builtin/credential -name '*.go' | wc -l

methods:

  # --------------------------------------------------------------------------
  aws:
    directory: builtin/credential/aws
    file_count: 26
    note: >-
      Acceptance criterion 6 target: builtin/credential/aws/path_login.go's
      crypto/subtle and crypto/x509 usages, cataloged below with
      security_relevant: true.
    entries:
      - file: builtin/credential/aws/path_login.go
        line_range: "511-546"
        function: verifyInstanceIdentitySignature
        algorithm: RSA-SHA256 signature verification (x509.SHA256WithRSA) of an EC2 instance identity document
        library: crypto/x509
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          cert.CheckSignature(x509.SHA256WithRSA, identityBytes,
          signatureBytes) at line 536 verifies AWS's RSA-SHA256 signature
          over the EC2 instance identity document against the registered
          AWS public certificates, before trusting any claim (instance ID,
          account ID, region) inside it. Security-relevant: this is the
          entire trust basis for EC2-based `aws/login`. RSA-SHA256 is
          FIPS-approved. Explicitly required by AC-6.
        engine_or_method: aws

      - file: builtin/credential/aws/path_login.go
        line_range: "552-601"
        function: parseIdentityDocument
        algorithm: PKCS#7 signature verification of an EC2 instance identity document
        library: github.com/hashicorp/vault/helper/pkcs7 (imported line 33)
        security_relevant: true
        fips_approved: false
        classification_rationale: >-
          pkcs7.Parse + pkcs7Data.Verify() (lines 563, 585) verify the PKCS#7
          signature AWS attaches to the instance identity document — the
          alternative to the raw RSA-SHA256 signature path above, selected
          when the caller supplies the `pkcs7` login parameter instead of
          separate identity/signature bytes. Security-relevant: same trust
          basis as verifyInstanceIdentitySignature. Marked fips_approved
          false pending confirmation of which digest/signature algorithm
          the vendored helper/pkcs7 package (and the DSA/RSA key type in the
          AWS-published certificate it verifies against, see certificates.go
          comment referencing dsa.PublicKey in signing_utils-equivalent
          code) actually exercises — helper/pkcs7 is Vault's own
          in-repo implementation, not a CMVP-evaluated module; flag for
          WO-009's dependency audit to confirm the underlying primitive.
          Explicitly required by AC-6.
        engine_or_method: aws

      - file: builtin/credential/aws/path_login.go
        line_range: "449-510"
        function: validateMetadata
        algorithm: Constant-time comparison of EC2 login client nonces
        library: crypto/subtle
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          subtle.ConstantTimeCompare at lines 459 and 490 compares the
          caller-supplied client_nonce against the stored value from a
          previous login, without leaking timing information — an
          anti-replay/anti-enumeration control for repeated EC2 logins.
          Security-relevant. Explicitly required by AC-6.
        engine_or_method: aws

      - file: builtin/credential/aws/path_role_tag.go
        line_range: "223-407"
        function: appendHMAC, verifyRoleTagValue, createRoleTagHMACBase64
        algorithm: HMAC-SHA256 role-tag integrity + constant-time comparison
        library: "crypto/hmac, crypto/sha256, crypto/subtle"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          appendHMAC (line 223) and verifyRoleTagValue (line 251) both call
          createRoleTagHMACBase64 (line 396), which performs
          hmac.New(sha256.New, []byte(key)) at line 400 to compute an HMAC
          over the EC2 role-tag plaintext at tag-creation time;
          verifyRoleTagValue recomputes it and compares with
          subtle.ConstantTimeCompare (line 272). Security-relevant: role
          tags are an EC2-instance-attached authorization artifact — a
          forgeable tag would grant the tag's policies to any instance that
          can set it. HMAC-SHA256 is FIPS-approved.
        engine_or_method: aws

      - file: builtin/credential/aws/path_config_certificate.go
        line_range: "157-221"
        function: decodePEMAndParseCertificate, awsPublicCertificates
        algorithm: X.509 certificate parsing/storage for AWS's published identity-document signing certificates
        library: crypto/x509
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Parses and caches the AWS public certificate(s) (default +
          operator-registered via `config/certificate/:cert_name`) used by
          verifyInstanceIdentitySignature/parseIdentityDocument above.
          Security-relevant: these are the trust anchors for EC2 login.
        engine_or_method: aws

  # --------------------------------------------------------------------------
  cert:
    directory: builtin/credential/cert
    file_count: 13
    entries:
      - file: builtin/credential/cert/path_login.go
        line_range: "313-431"
        function: verifyCredentials
        algorithm: TLS client-certificate chain and constraint verification (mutual TLS auth)
        library: "crypto/x509, crypto/tls, golang.org/x/crypto/ocsp"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Core of the `cert` auth method: validates the client certificate
          presented on the mTLS connection against configured trusted CAs
          and per-role constraints (matchesConstraints/matchesNames/
          matchesCommonName/matchesDNSSANs/matchesEmailSANs/matchesURISANs/
          matchesOrganizations/matchesOrganizationalUnits/
          matchesCertificateExtensions, lines 432-654). Security-relevant:
          this function IS the authentication decision.
        engine_or_method: cert

      - file: builtin/credential/cert/path_login.go
        line_range: "687-945"
        function: getTrustedCerts, loadTrustedCerts, loadTrustedCert, checkForCertInOCSP, checkForChainInCRLs, checkForValidChain
        algorithm: X.509 CertPool construction, OCSP-based and CRL-based revocation checking
        library: "crypto/x509, golang.org/x/crypto/ocsp"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Builds the trusted-CA pool from configured `certs/*` entries and
          checks presented certificates against OCSP (checkForCertInOCSP,
          line 881) and CRLs (checkForChainInCRLs, line 932) when
          revocation checking is enabled. Security-relevant: revocation
          status is part of the authentication decision.
        engine_or_method: cert

      - file: builtin/credential/cert/path_login.go
        line_range: "955-979"
        function: parsePEM, validateConnState
        algorithm: X.509 PEM parsing and TLS ConnectionState chain extraction
        library: "crypto/x509, crypto/tls"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          validateConnState reads the verified chains off the live
          *tls.ConnectionState for the request — the raw input to the
          entire cert-auth trust decision. Security-relevant.
        engine_or_method: cert

      - file: builtin/credential/cert/path_login.go
        line_range: "228-243"
        function: getClientCert
        algorithm: X.509 client certificate extraction from the request connection
        library: crypto/x509
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Pulls the leaf client certificate out of the request's TLS
          connection state for use throughout verifyCredentials.
          Security-relevant input to the auth decision.
        engine_or_method: cert

      - file: builtin/credential/cert/backend.go
        line_range: "84-207"
        function: (backend struct fields), initOCSPClient, fetchCRL, updateCRLs
        algorithm: X.509 CertPool caching, OCSP client lifecycle, CRL fetch/refresh
        library: "crypto/x509, golang.org/x/crypto/ocsp"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Maintains the backend-wide *x509.CertPool cache and *ocsp.Client
          used by every login request, and periodically refreshes
          configured CRLs. Security-relevant: stale/incorrect state here
          would affect every subsequent authentication decision.
        engine_or_method: cert

      - file: builtin/credential/cert/path_crls.go
        line_range: "103-292"
        function: populateCRLs, setCRL, findSerialInCRLs
        algorithm: X.509 CRL parsing (x509.ParseCRL) and revoked-serial lookup
        library: "crypto/x509, crypto/x509/pkix"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Parses operator-submitted CRLs (`certs/crls/:name`) and indexes
          revoked serials consulted by checkForChainInCRLs during login.
          Security-relevant: incorrect CRL parsing could let a revoked
          client certificate authenticate.
        engine_or_method: cert

      - file: builtin/credential/cert/path_certs.go
        line_range: "500-515"
        function: (cert-entry write validation)
        algorithm: X.509 ExtKeyUsage validation on registered trusted certificates
        library: crypto/x509
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          Confirms a non-CA certificate being registered under `certs/:name`
          has x509.ExtKeyUsageClientAuth (or Any) set before it is trusted
          for client authentication. Security-relevant configuration-time
          guardrail.
        engine_or_method: cert

      - file: builtin/credential/cert/test_responder.go
        line_range: "1-9999"
        function: (OCSP test responder fixture)
        algorithm: SHA-256 + OCSP response construction for integration tests
        library: "crypto/sha256, golang.org/x/crypto/ocsp"
        security_relevant: false
        fips_approved: true
        classification_rationale: >-
          Test-only fixture (builds a fake OCSP responder for
          path_login_test.go / backend_test.go). Excluded from
          security-relevance classification per the WO-007 edge case for
          test-only crypto imports.
        engine_or_method: cert
        status: test_only
        test_only: true

  # --------------------------------------------------------------------------
  userpass:
    directory: builtin/credential/userpass
    file_count: 5
    entries:
      - file: builtin/credential/userpass/path_login.go
        line_range: "75-166"
        function: pathLogin
        algorithm: bcrypt password verification, with a constant-time-compare fallback for pre-Vault-0.2 legacy plaintext passwords
        library: "golang.org/x/crypto/bcrypt, crypto/subtle"
        security_relevant: true
        fips_approved: false
        classification_rationale: >-
          bcrypt.CompareHashAndPassword (line 116) is the primary
          password-verification path for every current userpass account.
          The `default:` branch (line 122) uses
          subtle.ConstantTimeCompare only for accounts created before
          Vault 0.2 that still have a PasswordHash == nil legacy plaintext
          Password, and a fixed dummy bcrypt hash is compared for
          nonexistent users (line 108) specifically to avoid a timing
          side-channel that would reveal username existence.
          Security-relevant: this IS the authentication decision. bcrypt is
          not on the FIPS 140-3 Approved algorithm list (it is not a
          NIST-specified KDF/hash) — flag for Phase 2 remediation (evaluate
          PBKDF2-HMAC-SHA256 or a FIPS-Approved equivalent for new
          FIPS-mode installs; legacy hashes would need a migration path).
        engine_or_method: userpass

      - file: builtin/credential/userpass/path_user_password.go
        line_range: "95-124"
        function: updateUserPassword
        algorithm: bcrypt password hashing (bcrypt.DefaultCost)
        library: golang.org/x/crypto/bcrypt
        security_relevant: true
        fips_approved: false
        classification_rationale: >-
          bcrypt.GenerateFromPassword([]byte(password), bcrypt.DefaultCost)
          at line 108 is the write-path counterpart to the login
          verification above — hashes a new/updated password before
          storage. Security-relevant, same FIPS-approval status and Phase 2
          recommendation as the login path.
        engine_or_method: userpass

  # --------------------------------------------------------------------------
  approle:
    directory: builtin/credential/approle
    file_count: 8
    entries:
      - file: builtin/credential/approle/validation.go
        line_range: "121-134"
        function: createHMAC
        algorithm: HMAC-SHA256
        library: "crypto/hmac, crypto/sha256"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          hmac.New(sha256.New, []byte(key)) computes an HMAC used
          throughout this file to derive role-name and secret-ID storage
          keys (roleNameHMAC, secretIDHMAC — see call sites in
          nonLockedSecretIDStorageEntry, registerSecretIDEntry,
          secretIDAccessorEntry). Security-relevant: secret IDs are stored
          keyed by their HMAC rather than in plaintext, so an attacker with
          read access to storage cannot recover a valid secret_id from the
          key name alone. HMAC-SHA256 is FIPS-approved.
        engine_or_method: approle

  # --------------------------------------------------------------------------
  ldap:
    directory: builtin/credential/ldap
    file_count: 11
    entries:
      - file: builtin/credential/ldap/*.go
        line_range: "N/A"
        function: "N/A"
        algorithm: "N/A — no direct crypto/* or golang.org/x/crypto/* imports found"
        library: "github.com/go-ldap/ldap/v3, github.com/hashicorp/cap/ldap (TLS/StartTLS handled inside these dependencies)"
        security_relevant: true
        fips_approved: true
        classification_rationale: >-
          `grep -rn '"crypto\|golang.org/x/crypto' builtin/credential/ldap/*.go`
          returns zero matches. LDAP bind (including LDAPS/StartTLS) and any
          password hashing for the `password_policy`-driven root-credential
          rotation path are delegated entirely to go-ldap/v3 and
          hashicorp/cap/ldap, which construct their own crypto/tls.Config
          internally. Marked security_relevant: true (not the plain
          no_direct_imports case) because LDAP bind credentials transit
          this dependency boundary on every login — recorded here as a
          pointer for WO-009's dependency-level crypto audit rather than a
          call site in this repository.
        engine_or_method: ldap
        status: no_direct_imports

  # --------------------------------------------------------------------------
  okta:
    directory: builtin/credential/okta
    file_count: 9
    entries:
      - file: builtin/credential/okta/*.go
        line_range: "N/A"
        function: "N/A"
        algorithm: "N/A — no direct crypto/* or golang.org/x/crypto/* imports found"
        library: "github.com/okta/okta-sdk-golang/v5/okta, github.com/chrismalek/oktasdk-go/okta (HTTPS/TLS handled inside these SDKs)"
        security_relevant: false
        fips_approved: true
        classification_rationale: >-
          `grep -rn '"crypto\|golang.org/x/crypto' builtin/credential/okta/*.go`
          returns zero matches. Authentication is delegated to Okta's HTTPS
          API via the vendored Okta SDKs; this package only handles
          username/password/MFA-factor plumbing over an SDK-managed TLS
          connection, with no local cryptographic primitive usage. Recorded
          per the "no direct crypto imports" edge case.
        engine_or_method: okta
        status: no_direct_imports

  # --------------------------------------------------------------------------
  github:
    directory: builtin/credential/github
    file_count: 8
    entries:
      - file: builtin/credential/github/*.go
        line_range: "N/A"
        function: "N/A"
        algorithm: "N/A — no direct crypto/* or golang.org/x/crypto/* imports found"
        library: "github.com/google/go-github/v83/github, golang.org/x/oauth2 (HTTPS/TLS and OAuth2 token handling inside these SDKs)"
        security_relevant: false
        fips_approved: true
        classification_rationale: >-
          `grep -rn '"crypto\|golang.org/x/crypto' builtin/credential/github/*.go`
          returns zero matches. Authentication is a caller-supplied GitHub
          personal access token validated by calling the GitHub API over
          HTTPS via go-github/golang.org/x/oauth2; no local cryptographic
          primitive usage. Recorded per the "no direct crypto imports" edge
          case.
        engine_or_method: github
        status: no_direct_imports

  # --------------------------------------------------------------------------
  radius:
    directory: builtin/credential/radius
    file_count: 5
    entries:
      - file: builtin/credential/radius/*.go
        line_range: "N/A"
        function: "N/A"
        algorithm: "N/A — no direct crypto/* import; RFC 2865 mandates MD5 for the RADIUS User-Password attribute, implemented inside the layeh.com/radius dependency"
        library: "layeh.com/radius, layeh.com/radius/rfc2865 (path_login.go:18-19)"
        security_relevant: true
        fips_approved: false
        classification_rationale: >-
          `grep -rn '"crypto\|golang.org/x/crypto' builtin/credential/radius/*.go`
          returns zero matches — this package has no direct crypto import.
          However, RFC 2865 §5.2 mandates MD5 (RADIUS shared-secret XOR
          obfuscation of the User-Password attribute) for the RADIUS wire
          protocol itself, and that is implemented inside the
          third-party layeh.com/radius/rfc2865 dependency this package
          calls into on every `radius/login`. Individually classified per
          the WO-007 MD5 rule even though the call site is transitive: this
          is security-relevant (protects the RADIUS shared secret /
          password on the wire) and RFC-2865 MD5 obfuscation is not a
          FIPS-approved construction. This is a protocol-level constraint,
          not a Vault code defect — remediation options (RadSec/TLS
          transport, or accepting RADIUS as a documented non-FIPS-path
          auth method) belong to Phase 2/3 planning, not this inventory.
          Full dependency-level confirmation is WO-009's scope (go list -m
          all).
        engine_or_method: radius
        status: no_direct_imports

  # --------------------------------------------------------------------------
  token:
    directory: builtin/credential/token
    file_count: 1
    entries:
      - file: builtin/credential/token/backend.go
        line_range: "N/A"
        function: "N/A"
        algorithm: "N/A — no crypto imports; this package only registers the noop token auth backend"
        library: "N/A"
        security_relevant: false
        fips_approved: true
        classification_rationale: >-
          builtin/credential/token/backend.go is a single trivial file
          registering the built-in `token` auth method, which has no login
          path of its own (token auth is implicit). Token hashing/creation
          cryptography lives in vault/token_store.go (core), out of scope
          for this builtin/ scan and cataloged by WO-006. Recorded per the
          "engines may have zero crypto imports" edge case.
        engine_or_method: token
        status: no_direct_imports

summary:
  methods_required_by_ac: 9
  methods_present_in_repo: 9
  md5_usages_found_directly_in_builtin_credential: 0
  md5_usages_found_transitively: 1 # RFC 2865 via layeh.com/radius — see radius entry
  sha1_usages_found: 0
  security_relevant_findings_flagged_for_phase2:
    - "builtin/credential/userpass/path_login.go:75-166 and path_user_password.go:95-124 — bcrypt is not on the FIPS 140-3 Approved algorithm list"
    - "builtin/credential/radius/* (transitive, layeh.com/radius/rfc2865) — RFC 2865 mandates MD5 for User-Password obfuscation; protocol-level constraint"
    - "builtin/credential/aws/path_login.go:552-601 — PKCS#7 verification path uses Vault's own helper/pkcs7, not a CMVP-evaluated module; confirm underlying signature/digest algorithm via WO-009"
