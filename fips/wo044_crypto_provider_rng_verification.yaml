code_changes_made: >-
  command/server.go: extracted the existing FIPS entropy-augmentation guard
  (previously inline in parseConfig(), lines 453-457) into a new named
  method (*ServerCommand).applyFIPSEntropyOverride, called from
  parseConfig() with byte-identical logic and behavior — a pure,
  behavior-preserving refactor made solely to satisfy AC-6's unit-test
  requirement, since constants.IsFIPS() is a compile-time constant that
  cannot be mocked and the guard needed to be callable independently of the
  file-loading plumbing around it. command/server_test.go: added
  TestParseConfig_EntropyAugmentation_FIPSOverride and
  TestParseConfig_EntropyAugmentation_FIPSOverride_NoEntropyConfigured. No
  crypto provider, RNG, or DRBG code was added, removed, or modified by
  this work order, per its own explicit scope.
