residual_gaps_added:
  - id: RG-8
    title: "Community/OSS build has no CMVP-validated crypto provider or DRBG boundary"
    phase: "Phase 2/3"
    evidence:
      - "docs/fips/crypto-provider-verification.md section 1 and section 6"
      - ".github/workflows/ci.yml:265-299 (enterprise-gated test-go-fips job)"
      - ".release/security-scan.hcl:39-41,85-87 (boringcrypto-suffix scanner exemptions scoped to Enterprise FIPS pipeline)"
      - "go.mod:13, Makefile (no FIPS toolchain pin or reference)"
    description: >-
      The Community/OSS build executes crypto/rand.Reader and all crypto/*
      operations through Go's pure-Go stdlib implementation plus the host
      kernel's DRBG, neither of which carries a NIST CMVP certificate in
      this build configuration. A validated boundary requires
      GOEXPERIMENT=boringcrypto (Enterprise-only, per WO-011) plus a
      FIPS-mode host kernel — both outside this repository's CE build path.
      Build/distribution-model gap, not a source-code defect.
  - id: RG-9
    title: "vault/cluster.go:256 uses math/rand for an X.509 certificate serial number"
    phase: "Phase 2"
    evidence:
      - "vault/cluster.go:229 (key gen via c.secureRandomReader), :256 (mathrand.Int63() serial number), :264 (x509.CreateCertificate via rand.Reader)"
    description: >-
      The internal cluster mTLS self-signed certificate's key material and
      signature correctly use crypto/rand (via c.secureRandomReader); only
      the SerialNumber field uses math/rand's non-cryptographic generator.
      Low severity (serial numbers are not secret) but inconsistent with
      the crypto/rand posture everywhere else audited; recommend a one-line
      fix in a future Phase 2 WO.

