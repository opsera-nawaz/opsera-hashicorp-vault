code_changes_made: >-
  None required to production or test behavior. Four short pointer comments
  were added (builtin/logical/pki/backend_test.go, builtin/logical/pki/path_issue_sign.go,
  sdk/helper/certutil/x509verify/verify_test.go, builtin/logical/ssh/backend.go)
  referencing this disposition record at the exact lines audited above, so a
  future reader lands on the FIPS-CRYPTO-002 evidence trail instead of
  re-deriving it. No signing, hashing, or fingerprint logic was altered.
