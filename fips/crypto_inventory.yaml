  excluded_graph_only_nodes:
    description: 'Modules that appear in the full `go list -m all` module graph for one or more of the
      four in-scope go.mod files but (a) are not present in any of those four go.mod require blocks, and
      (b) are confirmed via `go mod why -m` as not needed by the main module for compilation. These do
      not introduce cryptographic functionality into the built Vault binary and are excluded from the
      `entries` list per the WO-009 scoping constraint.

      '
    entries:
    - module_path: github.com/golang-jwt/jwt
      version: v3.2.1+incompatible
      evidence: go mod why -m github.com/golang-jwt/jwt -> "main module does not need module github.com/golang-jwt/jwt"
    - module_path: github.com/miekg/pkcs11
      version: v1.1.1
      evidence: go mod why github.com/miekg/pkcs11 -> "main module does not need package github.com/miekg/pkcs11"
    - module_path: github.com/letsencrypt/pkcs11key/v4
      version: v4.0.0
      evidence: go mod why github.com/letsencrypt/pkcs11key/v4 -> "main module does not need package github.com/letsencrypt/pkcs11key/v4"
    - module_path: github.com/google/go-pkcs11
      version: v0.3.0
      evidence: go mod why github.com/google/go-pkcs11 -> "main module does not need package github.com/google/go-pkcs11"
  pkcs11_boundary_confirmation:
    wrapper_module: github.com/hashicorp/go-kms-wrapping/wrappers/pkcs11
    present_in_root_go_mod: false
    finding: '`github.com/hashicorp/go-kms-wrapping/wrappers/pkcs11` does not appear anywhere in `go.mod`''s
      require block or in the resolved `GOWORK=off go list -m all` module graph for the root module. The
      three generic PKCS#11 libraries that do appear in the graph (github.com/miekg/pkcs11, github.com/letsencrypt/pkcs11key/v4,
      github.com/google/go-pkcs11 — see excluded_graph_only_nodes) are unreachable transitive artifacts
      of unrelated dependencies and are not imported by any Vault package (`go mod why` confirms "main
      module does not need package" for each). This confirms Vault Community Edition (CE) excludes HSM/PKCS#11
      integration — that capability is Enterprise-only and is out of scope for the CE cryptographic boundary
      this inventory describes.

      '
container_images:
  entries:
  - id: ce-builder-ubuntu-focal
    dockerfile_stage: builder
    dockerfile_reference: Dockerfile:24 (FROM ubuntu:focal AS builder)
    base_image: ubuntu:focal
    os_family: Ubuntu 20.04 LTS (focal)
    libc: glibc
    role: cgo_cross_compilation_toolchain
    is_runtime_image: false
    crypto_library: not_applicable — build-only container, no Vault server process ever runs from this
      stage
    cmvp_status: not_applicable
    fips_gap: null
    notes: 'Used exclusively to cross-compile the Vault binary for CGO-enabled targets (Dockerfile:6-9).
      Chosen for its old-enough glibc baseline to remain compatible with all supported downstream distros.
      This image is never published or run as a Vault server; it has no bearing on the FIPS posture of
      a running Vault deployment.

      '
    source_file: fips/inventory/container_kms_inventory.yaml
    source_work_order: WO-010
  - id: ce-default-alpine
    dockerfile_stage: default
    dockerfile_reference: Dockerfile:58 (FROM alpine:3 AS default)
    base_image: alpine:3
    os_family: Alpine Linux 3.x
    libc: musl
    role: default_ce_runtime_image
    is_runtime_image: true
    published_as: docker.io/hashicorp/vault:<version>, public.ecr.aws/hashicorp/vault:<version> (.github/actions/containerize/action.yml:52-53,
      docker_container_target=default)
    crypto_library: musl libc + Go stdlib crypto/* packages; no OpenSSL FIPS provider present
    cmvp_status: not_cmvp_validated
    fips_gap: musl libc does not support OpenSSL FIPS provider self-test mechanism — not suitable for
      FIPS-path deployments
    notes: 'This is the default image most CE users pull. It MUST NOT be used for FIPS-path deployments
      because musl libc has no equivalent to glibc''s dynamic-linked OpenSSL FIPS provider self-test hooks,
      and no FIPS-validated crypto library ships in this image.

      '
    source_file: fips/inventory/container_kms_inventory.yaml
    source_work_order: WO-010
  - id: ce-ubi10-minimal
    dockerfile_stage: ubi
    dockerfile_reference: Dockerfile:142 (FROM registry.access.redhat.com/ubi10/ubi-minimal AS ubi)
    base_image: registry.access.redhat.com/ubi10/ubi-minimal
    os_family: Red Hat Universal Base Image 10 (RHEL 10 userland)
    libc: glibc
    role: fips_path_candidate
    is_runtime_image: true
    published_as: quay.io/redhat-isv-containers/... (.github/actions/containerize/action.yml:54-55, redhat_container_target=ubi,
      CE edition only)
    crypto_library: glibc + Red Hat OpenSSL/system crypto libraries; Red Hat's own FIPS-validated OpenSSL
      packages are available on UBI but are NOT activated by this Dockerfile stage
    cmvp_status: fips_path_candidate_requires_runtime_verification
    fips_gap: null
    notes: 'Documented as the FIPS-path candidate base image because it is glibc-based (a prerequisite
      for FIPS mode; musl is not). Red Hat maintains independently CMVP-validated OpenSSL/crypto packages
      for RHEL/UBI (tracked by Red Hat at access.redhat.com/articles/2918071), but that certificate covers
      Red Hat''s OpenSSL package, not Vault itself, and its applicability to this specific ubi10-minimal
      tag was NOT independently re-verified in this WO — flagged for confirmation in a later FIPS phase.

      This CE Dockerfile stage (Dockerfile:142-232) builds a plain ubi-minimal image and does NOT invoke
      any FIPS-mode activation (no `fips-mode-setup --enable` or `update-crypto-policies --set FIPS` call
      is present). It is therefore a FIPS-path CANDIDATE, not a FIPS-enabled image as shipped today. It
      is also distinct from the Enterprise-only `ubi-fips` / `ubi-hsm-fips` targets documented below,
      which do not exist in this file.

      Evidence of existing UBI build-pipeline support: .release/security-scan.hcl:97-100 already suppresses
      OSV scanner findings for UBI RPM package paths (usr/lib/sysimage/rpm/*, var/lib/rpm/*), confirming
      that UBI images are already built, scanned, and shipped through the existing release pipeline (i.e.,
      adding a hardened FIPS variant is an incremental change, not new infrastructure).

      '
    source_file: fips/inventory/container_kms_inventory.yaml
    source_work_order: WO-010
  enterprise_only_fips_images:
    present_in_ce_dockerfile: false
    evidence_source: .github/actions/containerize/action.yml:41-114 (shared composite action, branches
      by inputs.vault-edition)
    boundary_statement: 'The three stages defined in this CE Dockerfile (builder, default, ubi) do not
      include a `ubi-fips` or `ubi-hsm-fips` build target. Those Docker build targets are referenced only
      inside .github/actions/containerize/action.yml, a composite GitHub Action shared by CE and Enterprise
      CI workflows. The action only resolves `docker_container_target` to `ubi-fips` or `ubi-hsm-fips`
      when its `vault-edition` input is `ent.fips1403` or `ent.hsm.fips1403` (action.yml:77-99) — editions
      that are never produced by CE build workflows. A CE build/release therefore cannot produce a `ubi-fips`
      or `ubi-hsm-fips` image from the files in this repository.

      '
    entries:
    - image_target: ubi-fips
      edition: ent.fips1403
      action_reference: .github/actions/containerize/action.yml:86-98
      registry_tags: docker.io/hashicorp/vault-enterprise-fips:<version>-<edition>, public.ecr.aws/hashicorp/vault-enterprise-fips:<version>-<edition>
      availability: enterprise_only
      notes: Enterprise FIPS 140-3 build target. Requires the Enterprise build/license pipeline; the `ubi-fips`
        Dockerfile target it depends on does not exist in this CE repository.
    - image_target: ubi-hsm-fips
      edition: ent.hsm.fips1403
      action_reference: .github/actions/containerize/action.yml:77-85
      registry_tags: docker.io/hashicorp/vault-enterprise:<version>-<edition>, public.ecr.aws/hashicorp/vault-enterprise:<version>-<edition>
      availability: enterprise_only
      notes: 'Enterprise HSM+FIPS 140-3 build target (PKCS#11 HSM support). Requires the Enterprise HSM
        binary; corroborated by internalshared/configutil/kms.go:315-316, where the CE seal-wrapper factory
        explicitly rejects the `pkcs11` KMS type with the error "KMS type ''pkcs11'' requires the Vault
        Enterprise HSM binary". The `ubi-hsm-fips` Dockerfile target does not exist in this CE repository.

        '
kms_integrations:
  entries:
  - provider: AWS KMS
    go_wrapper_module: github.com/hashicorp/go-kms-wrapping/wrappers/awskms/v4
    go_wrapper_version: v4.0.4
    go_mod_reference: go.mod:114
    wired_in: internalshared/configutil/kms.go:298-299 (wrapping.WrapperTypeAwsKms case), kms.go:373-392
      (GetAWSKMSFunc); vault/core.go imports go-kms-wrapping/wrappers/awskms/v4
    seal_wrapper_type_string: awskms
    cmvp_certificate: requires_external_lookup
    fips_endpoint_available: true
    fips_endpoint_evidence: 'AWS KMS FIPS endpoints: kms-fips.<region>.amazonaws.com (e.g. kms-fips.us-east-1.amazonaws.com);
      FIPS 140-2 enabled interface VPC endpoint service com.amazonaws.<region>.kms-fips, available in
      all AWS Regions including GovCloud (US) since March 2023.'
    lookup_date: '2026-09-27'
    cmvp_lookup_notes: 'AWS publicly claims FIPS 140-3 Level 3 for AWS CloudHSM''s hsm2m.medium instance
      type (GA August 2024, built on Marvell LiquidSecurity hardware) at aws.amazon.com/compliance/fips.
      During this WO, NIST CMVP certificate #5146 was checked and found to be the "AWS-LC Cryptographic
      Module (dynamic)" — AWS''s software crypto library (BoringSSL/OpenSSL-derived, Overall Level 1),
      NOT the CloudHSM hardware module; it must not be cited as a CloudHSM certificate. No single CMVP
      certificate number could be conclusively bound to the exact CloudHSM hardware revision within this
      session''s lookup. This is recorded as requires_external_lookup rather than a guessed number, per
      the constraint against inventing certificate numbers. Re-check against the live CMVP Validated Modules
      Search before citing a certificate number in any compliance evidence package.

      '
    source_file: fips/inventory/container_kms_inventory.yaml
    source_work_order: WO-010
  - provider: Azure Key Vault
    go_wrapper_module: github.com/hashicorp/go-kms-wrapping/wrappers/azurekeyvault/v2
    go_wrapper_version: v2.0.16
    go_mod_reference: go.mod:429
    wired_in: internalshared/configutil/kms.go:301-302 (wrapping.WrapperTypeAzureKeyVault case), kms.go:393-410
      (GetAzureKeyVaultKMSFunc)
    seal_wrapper_type_string: azurekeyvault
    cmvp_certificate: requires_external_lookup
    fips_endpoint_available: false
    fips_endpoint_evidence: No distinct '-fips' hostname is published for Azure Key Vault / Managed HSM.
      FIPS 140-3 Level 3 assurance is obtained by selecting Managed HSM or Key Vault Premium (HSM-backed
      keys) as the key protection tier; both are reached via the same vault.azure.net / managedhsm.azure.net
      hostnames as non-HSM-backed keys.
    lookup_date: '2026-09-27'
    cmvp_lookup_notes: 'Microsoft announced (June/August 2024) that Azure Managed HSM and Key Vault Premium
      are powered by Marvell LiquidSecurity 1/2 HSMs certified FIPS 140-3 Level 3. During this WO, NIST
      CMVP certificate #3718 was checked and found to be "NITROXIII CNN35XX-NFBE HSM Family" (Marvell
      Semiconductor Inc.), Overall Level 3, but its status is Historical (superseded by certificate #4399)
      and the certificate text contains no reference to Microsoft or Azure — it must not be cited as "the
      Azure Managed HSM certificate." No certificate number could be conclusively bound to the specific
      Azure Managed HSM/Key Vault Premium hardware revision within this session. Recorded as requires_external_lookup;
      vendor confirmation (Microsoft Azure compliance documentation) needed before citing a number.

      '
    source_file: fips/inventory/container_kms_inventory.yaml
    source_work_order: WO-010
  - provider: GCP Cloud KMS
    go_wrapper_module: github.com/hashicorp/go-kms-wrapping/wrappers/gcpckms/v2
    go_wrapper_version: v2.0.14
    go_mod_reference: go.mod:430
    wired_in: internalshared/configutil/kms.go:304-305 (wrapping.WrapperTypeGcpCkms case), kms.go:411-429
      (GetGCPCKMSKMSFunc)
    seal_wrapper_type_string: gcpckms
    cmvp_certificate: requires_external_lookup
    fips_endpoint_available: false
    fips_endpoint_evidence: Cloud KMS has no separate FIPS hostname; FIPS posture is selected per CryptoKey
      via protection_level (SOFTWARE = BoringCrypto Module, FIPS 140-3 Level 1-validated primitives; HSM
      = FIPS 140-3 Level 3 hardware), on the same API endpoint (docs.cloud.google.com/kms/docs/protection-levels).
    lookup_date: '2026-09-27'
