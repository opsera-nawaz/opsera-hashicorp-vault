    output: "CHANGELOG-v1.10-v1.15.md:1861,2375,2901,3356: historical changelog entries\n  (\"core/fips:\
      \ use upstream toolchain for FIPS 140-2 compliance again;\n  this will appear as X=boringcrypto\
      \ on the Go version in Vault server\n  logs.\") — documentation of past releases, not active code\
      \ or CI.\n.release/security-scan.hcl:39,85: vulnerability-scanner exemption\n  comments (\"Exempt\
      \ these until the scanner can handle the\n  boringcrypto suffix for the FIPS 140-3 builds.\") —\
