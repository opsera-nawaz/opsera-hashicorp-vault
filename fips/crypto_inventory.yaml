  phase2_action: migrate_to_ecdsa_nist_curves
  notes: 'EdDSA/Ed25519 does not use a NIST-approved curve and is not on the FIPS 186-5 Approved list.
    Migrating to ECDSA P-256/P-384/P-521 is a wire-format-breaking change: Ed25519 produces a fixed 64-byte
    signature, while ECDSA (ASN.1 DER for MarshalingTypeASN1, or fixed-width R||S for MarshalingTypeJWS
    at policy.go:1500-1518) produces a different, variable-length encoding. Existing signed data/tokens
    created with Ed25519 keys cannot be verified by an ECDSA-only client and vice versa; dual-read support
    is required during migration (see risk R4 in architecture artifact).'
  source_file: fips/inventory/keysutil_policy_crypto_sites.yaml
  source_work_order: WO-005
