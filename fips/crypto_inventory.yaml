    - fips/inventory/builtin_logical_crypto_sites.yaml::gcp
    - fips/inventory/builtin_logical_crypto_sites.yaml::azure
    - fips/inventory/builtin_logical_crypto_sites.yaml::rabbitmq
    - fips/inventory/builtin_logical_crypto_sites.yaml::ldap
    - fips/inventory/builtin_logical_crypto_sites.yaml::terraform
    - fips/inventory/builtin_logical_crypto_sites.yaml::ad
    - fips/inventory/builtin_logical_crypto_sites.yaml::alicloud
    - fips/inventory/builtin_credential_crypto_sites.yaml::token
  FIPS-DEP-001:
    name: Cryptographic dependency identification
    status: PASS
    evidence: 'crypto_dependencies.entries: 25/25 module entries carry the full FIPS-DEP-001 classification
      field set (module_path, version, direct_or_transitive, crypto_operations, fips_approved_algorithms,
      non_approved_algorithms, consolidation_finding). The duplicate go-jose/golang-jwt major-version
      findings are a dependency-hygiene gap tracked in residual_gaps, not a classification-completeness
      gap.'
  FIPS-CONTAINER-001:
    name: Container and KMS/HSM classification
    status: PARTIAL
    evidence: 'container_images.entries: 2/3 images have a definitive cmvp_status (ce-ubi10-minimal is
      fips_path_candidate_requires_runtime_verification, not a definitive status); kms_integrations.entries:
      1/6 providers have a resolved cmvp_certificate (AWS KMS/Azure Key Vault/GCP Cloud KMS are requires_external_lookup;
      AliCloud KMS/OCI KMS are CMVP status unknown). Every image and provider IS classified by role/wiring
      — the gate is PARTIAL because their CMVP validation status is not fully confirmed in-repo, per residual_gaps.'
residual_gaps:
- id: RG-1
  title: TLS 1.0/1.1 remain configurable on the client API listener
  phase: Phase 2
  evidence:
  - fips/inventory/tls_listener_config.yaml#listener-tls-min-version
  - fips/inventory/tls_listener_config.yaml#listener-tls-max-version
  - internalshared/configutil/listener.go:75-76
  description: tls_min_version/tls_max_version accept tls10/tls11 for the client API listener (port 8200);
    no FIPS floor of tls12 is enforced at configuration time.
- id: RG-2
  title: ChaCha20-Poly1305 is exercised on security-relevant paths
  phase: Phase 2
  evidence:
  - fips/inventory/keysutil_policy_crypto_sites.yaml (KeyType_ChaCha20_Poly1305, policy.go:69,2212,2292)
  - fips/inventory/core_barrier_seal_crypto_sites.yaml (vault/core.go:1292-1315 default cluster cipher
    suites)
  - fips/inventory/tls_listener_config.yaml#cluster-cipher-suites
  - fips/inventory/builtin_logical_crypto_sites.yaml (builtin/logical/pki/acme_challenges.go:540-554)
  description: ChaCha20-Poly1305 is not FIPS 140-3 Approved but is selectable as a Transit AEAD KeyType,
    appears in the default cluster (port 8201) TLS cipher-suite list, and is offered in the PKI ACME TLS-ALPN-01
    challenge client's cipher allowlist.
- id: RG-3
  title: Ed25519 is exercised on security-relevant paths
  phase: Phase 2
  evidence:
  - fips/inventory/keysutil_policy_crypto_sites.yaml (KeyType_ED25519, policy.go:66 and its sign/verify/genkey
    call sites)
  - fips/inventory/builtin_logical_crypto_sites.yaml (pki/path_root.go:773-828, pki/issuing/signing_utils.go:82-155,
    database/credentials.go:303-381, ssh/path_config_ca.go:356-455)
  description: Ed25519 is not on the FIPS 186-5 Approved signature-algorithm list (non-NIST curve) but
    is a selectable KeyType/key_type across Transit, PKI CA/CSR issuance, database client-certificate
    auth, and the SSH secrets engine's CA key type.
- id: RG-4
  title: SHA-3 is excluded from the FIPS-validated boundary under boringcrypto builds
  phase: Phase 2/3
  evidence:
  - fips/inventory/keysutil_policy_crypto_sites.yaml (sdk/helper/keysutil/consts.go:61 HashFuncMap/CryptoHashMap;
    policy.go:1384,1602)
  description: SHA3-224/256/384/512 are selectable RSA-PSS/PKCS1v15/OAEP hash functions in sdk/helper/keysutil,
    but sdk/helper/keysutil/policy_test.go documents that Go's boringcrypto FIPS build does not support
    SHA-3.
- id: RG-5
  title: Shamir's Secret Sharing is not a FIPS-Approved mechanism
  phase: Phase 2/3
  evidence:
  - fips/inventory/core_barrier_seal_crypto_sites.yaml (vault/rekey.go shamir.Split/Combine; vault/seal/seal.go:817-845
    SetShamirSealKey/GetShamirKeyBytes)
  - fips/inventory/container_kms_inventory.yaml#non_kms_seals
  description: Shamir's Secret Sharing — Vault's default manual-unseal mechanism when no KMS auto-unseal
    is configured — does not appear on the NIST SP 800-140C/D Approved list. FIPS-path deployments should
    use a KMS/HSM auto-unseal provider instead.
- id: RG-6
  title: CMVP certificates for configured KMS/HSM backends are not tracked in-repo
  phase: Phase 3
  evidence:
  - fips/inventory/container_kms_inventory.yaml#kms_hsm_seal_integrations
  description: 'AWS KMS, Azure Key Vault, and GCP Cloud KMS wrapper integrations are recorded as cmvp_certificate:
    requires_external_lookup, and AliCloud KMS/OCI KMS as CMVP status unknown — no NIST CMVP certificate
    number is pinned in-repo for any of the five external KMS/HSM providers Vault can auto-unseal against.'
- id: RG-7
  title: Duplicate go-jose and golang-jwt major-version dependencies
  phase: Phase 2
  evidence:
  - fips/inventory/crypto_dependencies.yaml (github.com/go-jose/go-jose/v3 v3.0.5 + github.com/go-jose/go-jose/v4
    v4.1.5)
  - fips/inventory/crypto_dependencies.yaml (github.com/golang-jwt/jwt/v4 v4.5.2 + github.com/golang-jwt/jwt/v5
    v5.3.1)
  description: 'Both go-jose (v3 and v4) and golang-jwt (v4 and v5) coexist in the module graph; each
    pairing carries consolidation_finding: ''Duplicate major versions — consolidation recommended for
    dependency hygiene'' in crypto_dependencies.yaml.'
