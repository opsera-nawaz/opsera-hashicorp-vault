      \ test-only runtime check\n  (`if strings.Contains(runtime.Version(), \"X:boringcrypto\")`) that\n\
      \  skips SHA-3 assertions when the TEST BINARY was itself compiled with\n  GOEXPERIMENT=boringcrypto.\
      \ This is a runtime.Version() string check,\n  not a build tag, and it can only ever be true if\
      \ the process was\n  already built with the boringcrypto experiment (i.e. only inside the\n  enterprise-gated\
      \ test-go-fips job per F5) — it has no effect on\n  default CE test runs.\n.github/workflows/ci.yml:290:\
      \ see F5 (enterprise-gated job).\n"
    interpretation: 'Every boringcrypto reference in the repository is either historical documentation,
